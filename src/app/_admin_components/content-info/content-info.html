<div class="ci-page">
  <header class="ci-header">
    <div>
      <h1 class="ci-title">Contact Info</h1>
      <p class="ci-subtitle">{{ contactInfos?.length || 0 }} entry total</p>
    </div>
    <button class="btn-primary" data-bs-toggle="modal" data-bs-target="#createContactInfoModal">
      <i class="fa fa-plus"></i> New Entry
    </button>
  </header>

  <div class="ci-card">
    <table class="ci-table" *ngIf="contactInfos?.length; else emptyState">
      <thead>
        <tr>
          <th>Address</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Map</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of contactInfos">
          <td>{{ item.address }}</td>
          <td>{{ item.email }}</td>
          <td>{{ item.phone }}</td>
          <td>
            <a *ngIf="item.mapUrl" [href]="item.mapUrl" target="_blank" class="map-link">
              <i class="fa fa-map-marker"></i> View
            </a>
            <span *ngIf="!item.mapUrl" class="text-muted">-</span>
          </td>
          <td class="col-actions">
            <button class="icon-btn icon-btn--edit" data-bs-toggle="modal" data-bs-target="#editContactInfoModal" (click)="onSelected(item)" title="Edit">
              <i class="fa fa-edit"></i>
            </button>
            <button class="icon-btn icon-btn--danger" (click)="delete(item.id)" title="Delete">
              <i class="fa fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <ng-template #emptyState>
      <div class="empty-state">
        <i class="fa fa-address-book-o"></i>
        <p>No contact info yet</p>
        <span>Add your address, email, and phone details</span>
      </div>
    </ng-template>
  </div>
</div>

<!-- Create Modal -->
<div class="modal fade" id="createContactInfoModal" tabindex="-1" aria-labelledby="createContactInfoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content ci-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="createContactInfoModalLabel">Add Contact Info</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form #createForm="ngForm" (ngSubmit)="createContactInfo(); createForm.resetForm()">
        <div class="modal-body">
          <div class="form-field">
            <label>Address</label>
            <input type="text" class="form-control" name="address" [(ngModel)]="newContactInfo.address" required>
          </div>
          <div class="form-field">
            <label>Email</label>
            <input type="email" class="form-control" name="email" [(ngModel)]="newContactInfo.email" required>
          </div>
          <div class="form-field">
            <label>Phone</label>
            <input type="text" class="form-control" name="phone" [(ngModel)]="newContactInfo.phone" required>
          </div>
          <div class="form-field">
            <label>Map URL</label>
            <input type="text" class="form-control" name="mapUrl" [(ngModel)]="newContactInfo.mapUrl" placeholder="https://maps.google.com/...">
          </div>

          <div *ngIf="errors.length > 0">
            <div *ngFor="let errorObj of errors">
              <div *ngFor="let entry of (errorObj | keyvalue)">
                <span class="field-error">{{ entry.value }}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-primary"><i class="fa fa-save"></i> Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editContactInfoModal" tabindex="-1" aria-labelledby="editContactInfoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content ci-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="editContactInfoModalLabel">Edit Contact Info</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form #editForm="ngForm" (ngSubmit)="update()">
        <div class="modal-body">
          <div class="form-field">
            <label>Address</label>
            <input type="text" class="form-control" name="address" [(ngModel)]="editContactInfo.address" required>
          </div>
          <div class="form-field">
            <label>Email</label>
            <input type="email" class="form-control" name="email" [(ngModel)]="editContactInfo.email" required>
          </div>
          <div class="form-field">
            <label>Phone</label>
            <input type="text" class="form-control" name="phone" [(ngModel)]="editContactInfo.phone" required>
          </div>
          <div class="form-field">
            <label>Map URL</label>
            <input type="text" class="form-control" name="mapUrl" [(ngModel)]="editContactInfo.mapUrl" placeholder="https://maps.google.com/...">
          </div>

          <div *ngIf="errors.length > 0">
            <div *ngFor="let errorObj of errors">
              <div *ngFor="let entry of (errorObj | keyvalue)">
                <span class="field-error">{{ entry.value }}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-primary" [disabled]="editForm.invalid"><i class="fa fa-edit"></i> Update</button>
        </div>
      </form>
    </div>
  </div>
</div>
